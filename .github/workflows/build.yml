name: Build desktop platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Raylib on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraylib-dev

      - name: Install Raylib on macOS
        if: runner.os == 'macOS'
        run: brew install raylib

      - name: Install Raylib on Windows
        if: runner.os == 'Windows'
        run: vcpkg install raylib:x64-windows

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Configure on Linux and macOS
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: asteroid-shooter-${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'build/Release/asteroid_shooter.exe' || 'build/asteroid_shooter' }}
          if-no-files-found: error
          retention-days: 14